apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  labels:
    app: web-service
spec:
  selector:
    matchLabels:
      app: web-service
  replicas: 3
  template:
    metadata:
      name: web-pod
      labels:
        app: web-service
    spec:
      containers:
        - name: web-container
          image: registry.gitlab.com/pragdata/devsecops-gl2/web-server:e4e7a65a
          ports:
            - containerPort: 8000
              name: "http"
          env:
            - name: OLLAMA_URL
              value: "http://ollama-service.dso-project.svc.cluster.local:11434"
            - name: AWS_ENDPOINT_URL
              value: "http://garage.garage.svc.cluster.local:3900"
            - name: AWS_ACCESS_KEY_ID
              value: "GK0123456789ABCDEF01234567"
            - name: AWS_SECRET_ACCESS_KEY
              value: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
            - name: VISIT_COUNTER_FILE
              value: "s3://visitors/visits.txt"
---
apiVersion: v1
kind: Service
metadata:
  name: web-server
spec:
  type: ClusterIP
  selector:
    app: web-service
  ports:
    - name: http
      port: 8000
      targetPort: http
